# Local development stack for the Early Chain Discovery engine.
#
# The engine's identity truth lives in PostgreSQL: the spec requires JSONB,
# pg_trgm and (optionally) pgvector, plus BRIN/GIN index types that SQLite
# cannot express. Redis backs the production queue/scheduler.
name: ecd

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecd
      POSTGRES_PASSWORD: ecd_dev_password
      POSTGRES_DB: ecd
      # Deterministic collation so name normalization/ordering is stable.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "55432:5432"
    volumes:
      - ecd_pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecd -d ecd"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ecd-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    ports:
      - "56379:6379"
    volumes:
      - ecd_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------
  # Application services.
  #
  # Started only with `--profile app`, so the default `docker compose up -d`
  # brings up just the datastores for local development against the host
  # Python environment.
  # ---------------------------------------------------------------------
  migrate:
    profiles: ["app"]
    build: .
    container_name: ecd-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://ecd:ecd_dev_password@postgres:5432/ecd
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["app"]
    build: .
    container_name: ecd-api
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://ecd:ecd_dev_password@postgres:5432/ecd
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORE_PATH: /app/data/raw_evidence
      CORS_ALLOWED_ORIGINS: '["http://localhost:8000"]'
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ecd_evidence:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The verifier fetches attacker-controlled URLs, so the container it runs
    # in gets no more privilege than it needs (spec 15 "Isolation").
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  ecd_pgdata:
  ecd_redisdata:
  ecd_evidence:
