[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chainradar"
version = "1.0.0"
description = "ChainRadar - Early Chain Discovery and Africa Expansion Intelligence Engine"
authors = [{ name = "ChainRadar Intelligence Team" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "defusedxml>=0.7.1",
    "beautifulsoup4>=4.12.3",
    "pyyaml>=6.0.1",
    "apscheduler>=3.10.4",
    "jinja2>=3.1.4",
    "dnspython>=2.6.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
chainradar = "src.cli.main:app"

[tool.setuptools]
packages = ["src", "src.storage", "src.core", "src.collectors", "src.collectors.registries", "src.collectors.github", "src.collectors.web_news", "src.collectors.ats", "src.collectors.social", "src.verifier", "src.verifier.adapters", "src.classifiers", "src.scoring", "src.alerting", "src.scheduler", "src.compliance", "src.api", "src.api.routes", "src.backtesting", "src.cli"]

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
